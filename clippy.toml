# The guarded NAME-MUTATION funnel (see src/atomic/mod.rs, "The
# reserved-spelling guard is STRUCTURAL, not a list of call sites").
#
# WHY A LINT AND NOT A SOURCE AUDIT. The compiler resolves every spelling of a
# name to ONE symbol, so a `disallowed_methods` entry catches what a text or
# AST scan has to enumerate and can miss: a parenthesized callee
# `(std::fs::remove_file)(p)`, a referenced callee `(&std::fs::rename)(a, b)`,
# a same-file or cross-file `use ... as` alias, a re-export, a raw identifier,
# a `macro_rules!` body, a `#[path]`-relocated module, and a `libc` extern fn.
# The lint is the COMPLETENESS device. It is armed by
# `#![deny(clippy::disallowed_methods)]` at the crate root (src/lib.rs), so a
# violation fails `cargo clippy --all-targets -- -D warnings`.
#
# DIVISION OF LABOUR. The count PIN
# (`atomic::guard::tests::std_fs_name_mutation_counts_are_pinned` and the
# `libc` funnel SURFACE PIN in `no_libc_reference_outside_the_funnel`) is a
# DIFFERENT device with a DIFFERENT job: it notices when the funnel's OWN calls change —
# i.e. inside the very modules where this lint is `#![allow]`ed and therefore
# blind — while this lint notices a call anywhere ELSE. Neither device covers
# the other; both stay.
#
# The symbols below are the name mutators and REPLACERS (the inode mutators, the
# mode-bit setter, and `std::fs::write`, whose create-on-absent path ADOPTS a
# name) whose authority the funnel owns. A production call may appear only in an
# item or module annotated with `#[allow(clippy::disallowed_methods)]` — there
# is NO allow list in this file; the allows are `#[allow]` attributes in the
# source.
# The CURRENT allow sites are:
#
#   * the three MODULE-level funnel modules, each carrying an inner
#     `#![allow(clippy::disallowed_methods)]`:
#       src/atomic/unix.rs, src/atomic/mod.rs, src/atomic/windows.rs.
#     `src/atomic/guard.rs` does NOT carry its own attribute but is a CHILD of
#     `src/atomic/mod.rs`, so that module-level allow covers it too (verified:
#     a `std::fs::write` planted at the top level of guard.rs is not linted);
#     the atomic module is the funnel and guard.rs is one of its files;
#   * two ITEM-level capability-gated workers, each reachable only with a
#     `crate::atomic::GuardedRel<'_>` proof that the reserved-spelling guard ran:
#       transport::durable_create_new, transport::remove_file_if_inner;
#   * `platform::chmod` (the ONE PATH-BASED mode authority) and
#     `platform::symlink` (the ONE std-symlink site);
#   * `lock::unix::open_lock_file` and `lock::windows::open_lock_file` — the
#     LOCK PROTOCOL's own record open. Each is the ONE function the crate's
#     lock acquisition uses to open (creating on first use) the lock record at
#     a path the PROTOCOL computes, and each refuses a symlink/reparse point at
#     the record's own spelling (`O_NOFOLLOW` / `FILE_FLAG_OPEN_REPARSE_POINT`
#     plus a handle check) and never truncates. The reserved-spelling guard has
#     no jurisdiction here (it exists to stop OTHER paths from mutating the
#     record); the no-follow open is what protects this one.
#   * `transport::ssh::hostkey::pin_known_hosts`, a REVIEWED exception: it
#     mutates only the transport's own private cache directory (never a
#     caller-supplied store-relative name), so it cannot name a lock record;
#   * the item-level `std::fs::create_dir_all` sites REVIEWED as creating only
#     a directory the caller names outright and the reserved-spelling guard has
#     no jurisdiction over: `transport::ensure_operation_lock_sidecar_durable`,
#     `transport::LocalTransport::root_dir`, `transport::provision_layout`,
#     `sync::apply::create_lock_parent`, `sync::apply::root_for_mutation`, and
#     `transport::ssh::SshTransport::prepare_identity`;
#   * `transport::open_verify_local` — the LOCAL descriptor-bound verify open.
#     Its `custom_flags` set is `O_NOFOLLOW | O_NONBLOCK` on a READ-ONLY
#     `OpenOptions` (`read(true)`, NO `create`/`create_new`), so it ADOPTS no
#     name and creates no entry; the deny of `OpenOptionsExt::custom_flags` is
#     relaxed for exactly this descriptor-bound sequence, the way
#     `platform::chmod` relaxes `set_permissions`. It is a PRODUCTION item
#     (`#[cfg(test)]` is on the `swap` PARAMETER only).
#
# ENUMERATE the current attributes rather than trusting this comment:
#
#     rg -n 'allow\(clippy::disallowed_methods\)' src
#
# Every attribute that command lists and this comment does NOT name above must
# sit on a `#[cfg(test)]` module or item — none of those is a production
# funnel. THE INHERITANCE RULE: a module-level inner
# `#![allow(clippy::disallowed_methods)]` applies to every item in the module
# AND to every child module declared in it (including a `mod`/`#[path]` child
# file), which is why the three `atomic` files are ONE funnel region and why
# `atomic/guard.rs`, a child of `atomic/mod.rs`, carries no attribute of its
# own. Naming the enumeration command here keeps the list checkable, so it
# cannot go stale silently the way the previous "Every OTHER attribute sits on
# a `#[cfg(test)]` module" sentence did (it missed
# `transport::open_verify_local`, a production item-level allow).
#
# The `libc` set names the POSIX name-mutation syscalls the funnel owns: the
# `*at` forms it calls, their plain (non-`*at`) forms, and the `open`/`openat`
# pair (which adopt or truncate a name with `O_CREAT`/`O_TRUNC`). It is NOT
# claimed to be EVERY mutating `libc` symbol: a symbol the funnel does not use
# is not denied here, and a new `libc` REFERENCE anywhere outside the funnel is
# caught by the exact per-module `libc` surface audit in
# `atomic::guard::tests::no_libc_reference_outside_the_funnel` whatever this
# list says. What this list must satisfy is the consistency property:
# `atomic::guard::tests::every_mutation_symbol_the_funnel_uses_is_denied_crate_wide`
# derives this file's list and the funnel's resolved call targets and fails if
# the funnel adopts a `std::fs`/`libc` call this file does not deny. That
# derivation learns a call from its path at ANY depth — a free function, an
# inherent associated function (`std::fs::File::create`), and a builder METHOD
# call whose receiver resolves to an `OpenOptions`/`DirBuilder` chain or local
# (`std::fs::OpenOptions::create_new`) — so the INHERENT and BUILDER entries
# below are covered by the derived test, not just by a hand-kept list.
disallowed-methods = [
  # std::fs — the removal/replacement/rename/link calls that FREE or SWAP an
  # entry's inode, plus the CREATION calls that ADOPT a name (the guard's
  # reserved-spelling check is what makes a name-creating call safe, so a
  # creation bypasses that check exactly as a removal does), plus the
  # path-based mode setter.
  { path = "std::fs::remove_file", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "std::fs::remove_dir", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "std::fs::remove_dir_all", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "std::fs::rename", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "std::fs::hard_link", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "std::fs::create_dir", reason = "name creation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "std::fs::create_dir_all", reason = "name creation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "std::fs::set_permissions", reason = "mode-bit authority is funnel-owned; call platform::chmod instead" },
  # std::fs — the INHERENT/ASSOCIATED and BUILDER spellings of the SAME
  # adoption. A free-function-only list is NOT complete: the compiler resolves
  # `std::fs::File::create(p)` and `std::fs::copy(src, dst)` to different
  # symbols than `std::fs::create_dir`, and an `OpenOptions` builder adopts a
  # name through its `create`/`create_new` FLAG, not through the terminal
  # `open`. `File::create`/`File::create_new` are `create(true)`/`create_new(true)`,
  # `DirBuilder::create` adopts a directory name, and `std::fs::copy`'s
  # DESTINATION adopts a name.
  #
  # The FLAG methods are denied rather than the terminal `std::fs::OpenOptions::open`
  # ON PURPOSE: the flag is what decides adoption, so denying it leaves a
  # read-only `OpenOptions::new().read(true).open(p)` legal (a caller who wants
  # to open read-only must not need an allow), while `open` on every builder is
  # an allow. `std::fs::OpenOptions::truncate` is deliberately NOT here:
  # `truncate(true)` cannot ADOPT a name (only `create`/`create_new` can), it is
  # the content-mutation class the crate leaves to `std::fs::write` — which the
  # deny below now covers because `std::fs::write` CREATES on an absent path —,
  # and the lint matches the method
  # NAME, so a deny would fire on the harmless `.truncate(false)` that the
  # lock's own open and read-only opens spell explicitly — none of which is an
  # adoption.
  { path = "std::fs::File::create", reason = "name creation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "std::fs::File::create_new", reason = "name creation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "std::fs::OpenOptions::create", reason = "the create flag decides name adoption; call the guarded atomic primitive instead" },
  { path = "std::fs::OpenOptions::create_new", reason = "the create_new flag decides name adoption; call the guarded atomic primitive instead" },
  { path = "std::fs::DirBuilder::create", reason = "name creation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "std::fs::copy", reason = "the copy DESTINATION adopts a name; call the guarded atomic primitive instead" },
  # `std::fs::write` CREATES a file at an absent path, so a non-funnel call
  # ADOPTS any absent name — including a reserved spelling — exactly as
  # `create_dir` does. It is therefore a name mutation, not merely content:
  # the guarded replacement is `atomic::write_atomic_replace` (the name-owning
  # replace), and the funnel's `write_file_fd` runs `refuse_reserved_mutation`
  # first and preserves the inode of an EXISTING entry, so its only adoption is
  # of a name the guard has already cleared.
  { path = "std::fs::write", reason = "create-or-truncate ADOPTS an absent name; call the guarded atomic primitive instead" },
  # std::os — the platform symlink creators, the `std::fs`-shaped creation
  # wrappers that do not live under `std::fs`. `platform::symlink` is the ONE
  # production site; every other site is an error.
  { path = "std::os::unix::fs::symlink", reason = "name creation is funnel-owned; call platform::symlink instead" },
  { path = "std::os::windows::fs::symlink_file", reason = "name creation is funnel-owned; call platform::symlink instead" },
  { path = "std::os::windows::fs::symlink_dir", reason = "name creation is funnel-owned; call platform::symlink instead" },
  # std::os — the `custom_flags` ADOPTION. On UNIX `custom_flags` forwards
  # ARBITRARY bits to `open(2)`, and `O_CREAT` through it CREATES a name:
  # `OpenOptions::new().write(true).custom_flags(O_CREAT).open(p)` adopts `p`
  # exactly as `.create(true)` does (measured: macOS `O_CREAT` = 512, Linux
  # x86_64 = 64; both created the name through `custom_flags` alone). On WINDOWS
  # `custom_flags` forwards ARBITRARY `dwFlagsAndAttributes` bits to
  # `CreateFileW`, and the creation DISPOSITION is a SEPARATE argument that the
  # create/create_new/access_mode flags decide — so the Windows form cannot adopt
  # a name by itself. It is denied for PARITY and defence in depth: the same
  # builder spelling must not be an unreviewed door to an arbitrary flag class on
  # a name-taking API, and the two platform forms of one method must not have
  # different authority.
  #
  # It is a TRAIT method, so clippy must be told the RESOLVED trait path; the
  # crate's surface derivation records the SYNTACTIC builder spelling
  # `std::fs::OpenOptions::custom_flags`, so
  # `atomic::guard::tests::reconciled_denied_symbols` maps the two spellings
  # together and the closure test and the deny agree. A reviewed open that sets
  # only NON-adopting bits (`O_NOFOLLOW`/`O_CLOEXEC`/`O_NONBLOCK`/
  # `O_DIRECTORY`/`FILE_FLAG_OPEN_REPARSE_POINT`/
  # `FILE_FLAG_BACKUP_SEMANTICS`) carries an item-level `#[allow]` (or sits
  # inside the `atomic` funnel module, whose allow covers it).
  { path = "std::os::unix::fs::OpenOptionsExt::custom_flags", reason = "custom_flags forwards arbitrary open(2) bits; O_CREAT through it adopts a name — call the guarded atomic primitive instead" },
  { path = "std::os::windows::fs::OpenOptionsExt::custom_flags", reason = "custom_flags forwards arbitrary CreateFile flag bits on a name-taking API; denied for parity with the Unix adoption form" },
  # std::os — the PATHNAME-SOCKET binds. `bind` on a Unix-domain listener or
  # datagram creates a directory entry at the bound path, so it is a name
  # ADOPTION in the same class as `create_dir`/`symlink`; a production module
  # could otherwise bind a socket at a reserved spelling with every device green.
  # There is no stable `std` pathname-socket creator on Windows (named pipes are
  # raw `windows_sys`/`winapi` calls), which is stated as a NAMED RESIDUAL below.
  { path = "std::os::unix::net::UnixListener::bind", reason = "a pathname-socket bind creates a directory entry; call the guarded atomic primitive instead" },
  { path = "std::os::unix::net::UnixDatagram::bind", reason = "a pathname-socket bind creates a directory entry; call the guarded atomic primitive instead" },
  #
  # NAMED RESIDUAL OF THE COMPLETENESS CLAIM (round 8, P2-A): the deny list is a
  # list of RESOLVED `std`/`libc` symbols. A Windows named-pipe creator
  # (`CreateNamedPipeW`) or a raw `CreateFileW`/`NtCreateFile` reached through
  # `windows_sys` is NOT a `std` symbol, so this lint does not name it and the
  # `libc` belt (which is libc-specific) does not either. The crate's own
  # `windows_sys` uses today are non-adopting (`GetFileInformationByHandle`,
  # `LockFileEx`/`UnlockFileEx`), and Rust's stable `std` exposes no named-pipe
  # creator, so the reach is "a raw Win32 creator the crate would have to add" —
  # the same reach as the raw `extern "C"` declaration residue in
  # `src/atomic/guard.rs`'s module docs. It is named here rather than left
  # unmentioned.
  # libc — the POSIX name-mutation syscalls the funnel wraps as `*at` calls.
  { path = "libc::unlink", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::unlinkat", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::rmdir", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::rename", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::renameat", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::link", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::linkat", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::symlink", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::symlinkat", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::mkdir", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::mkdirat", reason = "name mutation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::open", reason = "name creation/truncation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::openat", reason = "name creation/truncation is funnel-owned; call the guarded atomic primitive instead" },
  # libc — the remaining pure name CREATORS. The belt test
  # (`every_libc_call_symbol_the_tree_references_is_classified`) derives every
  # `libc::<fn>` call the tree references and forces a classification, so a
  # creator the funnel does not itself use is DENIED here rather than left to
  # the belt alone: `libc::mkfifo` in particular creates a directory entry at a
  # name, exactly as `libc::mkdir` does. The crate's live uses of these are all
  # `#[cfg(test)]` and carry the standard test allow; there is no production
  # call.
  { path = "libc::mkfifo", reason = "name creation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::mkfifoat", reason = "name creation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::mknod", reason = "name creation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::mknodat", reason = "name creation is funnel-owned; call the guarded atomic primitive instead" },
  { path = "libc::creat", reason = "name creation is funnel-owned; call the guarded atomic primitive instead" },
]
