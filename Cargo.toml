[package]
name = "storekit"
version = "0.1.0"
edition = "2024"
description = "A durable, symlink-confined local store and the transport that moves it between hosts."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
walkdir = "2"
unicode-normalization = "0.1"
libc = "0.2"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
# The Windows advisory lock (LockFileEx/UnlockFileEx) and the process-group
# runner's Windows port. Same feature set the source crate uses.
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
# The `std::fs` name-mutation audit PARSES each crate source instead of
# matching text, so raw identifiers, whitespace, and cross-file module aliases
# are no longer spellable evasions. `default-features = false` keeps the
# derive macro, printing, and the proc-macro bridge out of the build; `full`
# gives the complete item/expression AST and `visit` the immutable walker.
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }
# Parses `clippy.toml` as TOML so the audit accepts every spelling clippy accepts
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
